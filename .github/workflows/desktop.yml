name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - if: runner.os == 'macOS'
        run: npm run test:e2e:timing
      - if: runner.os == 'macOS'
        run: npm run test:e2e:mobile
      - run: npm run smoke:binary -w @gts/desktop
      - run: npm run package:dir -w @gts/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  package:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/worker/pyproject.toml
      - run: npm ci
      - run: python -m pip install "./services/worker[desktop,high-accuracy]"
      - run: npm run desktop:sidecar
      - run: npm run build
      - run: npm run package -w @gts/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: guitar-tab-studio-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: guitar-tab-studio-*
          path: artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp '{}' release-assets/ \;
          cp RELEASE_NOTES.md release-assets/
          test -z "$(find release-assets -maxdepth 1 -name '* *' -print -quit)"
          test "$(find release-assets -maxdepth 1 -name '*.dmg' | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -ge 2
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
          (
            cd release-assets
            sha256sum * > SHA256SUMS
          )
      - uses: softprops/action-gh-release@v2
        with:
          name: Guitar Tab Studio ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*
